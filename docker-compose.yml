# T0.2a: PostgreSQL plus two networks (Blueprint Section 6.2 and Section 9 item 1).
#
# agent_net:    the only network the agent runtime may join.
# internal_net: internal: true. The gateway, the connector services and the database share it.
#               It has no route to the host or the internet. The connectors service
#               arrives in T1.4 and joins this network; do not publish its port.
#
# The database is not on agent_net. It sits on internal_net for the gateway and connectors,
# and on the implicit default network so the host can reach it on POSTGRES_PORT during local
# development. That port is published on 127.0.0.1 only, not on the LAN.
services:
  db:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - default
      - internal_net

networks:
  agent_net: {}
  internal_net:
    internal: true

volumes:
  pgdata:
